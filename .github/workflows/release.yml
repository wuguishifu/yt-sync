name: Release

run-name: Release (${{ inputs.version-bump-type }})

on:
  workflow_dispatch:
    inputs:
      version-bump-type:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  # write: creating the release also creates the vX.Y.Z tag that the version bump counts from
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: bump version
        id: version
        uses: wuguishifu/version-bump-workflow@v1
        with:
          bump-type: ${{ inputs.version-bump-type }}

      # The Dockerfile copies package.json into the image, so stamp the release version on it.
      - name: update package version
        uses: wuguishifu/version-bump-workflow/set-package-version@v1
        with:
          version: ${{ steps.version.outputs.version }}

      - name: docker image
        id: docker
        uses: wuguishifu/version-bump-workflow/docker-image@v1
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ github.repository }}
          version: ${{ steps.version.outputs.version }}

      - name: setup qemu
        uses: docker/setup-qemu-action@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 too: the README supports running on aarch64 hosts. The plain X.Y.Z tag is for
      # self-hosters who want to pin a version without the commit suffix.
      - name: build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.docker.outputs.image }}
            ${{ steps.docker.outputs.image-name }}:${{ steps.version.outputs.version }}
            ${{ steps.docker.outputs.image-latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.docker.outputs.image }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Image: \`$IMAGE\`"
